name: SARIFIO build

on:
  push:
    branches: [main]
    paths-ignore:
      - "mobile/test/screens/**"
      - ".github/workflows/screenshots.yml"
      - "web/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Staging API URL (leave empty for on-device Test Mode)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build SARIFIO-Android-Test.apk
        working-directory: mobile
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          mkdir -p dist
          set -o pipefail
          ./tool/build_apk.sh 2>&1 | tee dist/build.log
      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Android build failed'
            echo '```'
            grep -nE "error|Error|ERROR|FAILED|Exception|What went wrong|Try:" mobile/dist/build.log | head -120
            echo '--- last 80 lines ---'
            tail -n 80 mobile/dist/build.log
            echo '```'
          } > /tmp/report.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: SARIFIO-Android-Test
          path: mobile/dist/SARIFIO-Android-Test.apk
          retention-days: 30
      - name: Publish the APK as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-build-${{ github.run_number }}"
          gh release create "$TAG" mobile/dist/SARIFIO-Android-Test.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "SARIFIO Android test build #${{ github.run_number }}" \
            --notes "Test Mode build — simulated exchanges only, no real money moves. Install on Android: open the APK, allow 'Install unknown apps', tap Install."

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_sqlite, bcmath", tools: composer }
      - name: Build Laravel app with the SARIFIO overlay
        run: ./backend/setup.sh "$RUNNER_TEMP/sarifio-api"
      - name: Run tests (fee engine, ledger, idempotency, eBirr / M-Pesa flows)
        working-directory: ${{ runner.temp }}/sarifio-api
        run: php artisan test
