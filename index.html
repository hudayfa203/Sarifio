<style>
/* Layout: one shell, two worlds — the public sarifio.com website and the admin.sarifio.com dashboard — sharing one live test ledger. */
:root{
  --ink:#0B1B33; --blue:#2458F2; --teal:#14B8A0; --teal-dk:#0C6B5C;
  --bg:#F4F6F9; --card:#FFFFFF; --line:#DFE5EE; --chip:#EEF2F7;
  --fg:#0B1B33; --fg2:#55657E; --hero:#0B1B33; --hero-fg:#FFFFFF; --hero-fg2:#B9C6DA;
  --amber-bg:#FBF1E2; --amber:#8A5A12; --ok-bg:#E7F7F3; --ok:#0C6B5C; --bad-bg:#FBE7E8; --bad:#A82E33; --mute-bg:#EEF0F4; --mute:#3E4C63;
  --side:#0B1B33; --side-fg:#C9D4E5;
  --f-display:"Sora", "Manrope", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070F1E; --card:#0F1C31; --line:#1E2D47; --chip:#16253D; --fg:#EEF2F8; --fg2:#9FB0C8; --hero:#12295A;
  --amber-bg:#3A2A10; --amber:#F1C27A; --ok-bg:#0E3B35; --ok:#5FD9C4; --bad-bg:#3D1719; --bad:#F2A2A5; --mute-bg:#1E2D47; --mute:#C9D4E5;
  --side:#050B16; --blue:#5B85FF; --teal-dk:#5FD9C4; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#070F1E; --card:#0F1C31; --line:#1E2D47; --chip:#16253D; --fg:#EEF2F8; --fg2:#9FB0C8; --hero:#12295A;
  --amber-bg:#3A2A10; --amber:#F1C27A; --ok-bg:#0E3B35; --ok:#5FD9C4; --bad-bg:#3D1719; --bad:#F2A2A5; --mute-bg:#1E2D47; --mute:#C9D4E5;
  --side:#050B16; --blue:#5B85FF; --teal-dk:#5FD9C4; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--amber-bg)}
button,input,select,textarea{font:inherit;color:inherit}

/* test strip + mode switch */

/* shared bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.pad{padding:18px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:0 20px;height:48px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:#fff;color:#0B1B33}}
.btn.teal{background:var(--teal);color:#04231E}

.p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-warn{background:var(--amber-bg);color:var(--amber)} .p-mute{background:var(--mute-bg);color:var(--mute)} .p-blue{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--fg2)}
.in{height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);min-width:0}
textarea.in{height:auto;padding:10px 12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv span:first-child{color:var(--fg2)} .kv span:last-child{font-weight:700;text-align:right}
.kv.big span{font-weight:800;color:var(--fg);font-size:15.5px}
hr{border:0;border-top:1px solid var(--line);margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--fg2);font-weight:700;padding:10px 12px;background:color-mix(in srgb,var(--chip) 60%,transparent)}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tablebox{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(5,11,22,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .card{max-width:480px;width:100%;max-height:90vh;overflow:auto}
.mark{width:30px;height:30px;flex:none}

/* website */
.site-nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:18px}
.site-nav a.nl{color:var(--hero-fg2);text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer}
.site-nav a.nl[aria-current="page"]{color:#fff}
.wordmark{font-family:var(--f-display);font-weight:600;letter-spacing:.14em;font-size:18px}
.hero{background:var(--hero);color:var(--hero-fg);position:relative;overflow:hidden}

.hero-grid{display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding-block:40px 72px;position:relative}

.calc{width:420px;max-width:100%;background:var(--card);color:var(--fg);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.sec{padding-block:64px}
.sec h2{font-size:clamp(26px,3.6vw,38px)}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.footer{background:#070F1E;color:#9FB0C8}
.footer a{color:#C9D4E5;text-decoration:none}

/* admin */
.admin{display:flex;flex-wrap:wrap;min-height:calc(100vh - 50px)}
.side{flex:1 1 230px;max-width:100%;background:var(--side);color:var(--side-fg);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:16px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.side button[aria-current="page"]{background:rgba(255,255,255,.09);color:#fff;font-weight:800}
.side button:focus-visible{outline:2px solid #5B85FF}
.main{flex:999 1 560px;min-width:0;padding-block:22px;padding-left:clamp(16px,3vw,32px);padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:600}
.kpi.dark{background:var(--ink);color:#fff;border-color:transparent} .kpi.dark .muted{color:#9FB0C8}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:color-mix(in srgb,var(--blue) 35%,transparent);border-radius:5px 5px 0 0;min-height:2px}
.bars div.hi{background:var(--blue)}
.provgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.switch{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--line);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--teal)} .switch[aria-checked="true"]::after{left:21px}
@media (max-width:760px){.side{flex-basis:100%;padding-block:12px;gap:10px}.side nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}.side nav button{white-space:nowrap;padding:8px 12px}.side>div:last-child{flex-direction:row;margin-top:0}}
.dl{background:#0B1B33;color:#fff;border-top:1px solid #1E2D47}
.dl-grid{display:flex;flex-wrap:wrap;gap:40px;align-items:center}
.store{display:inline-flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;border-radius:14px;background:#fff;color:#0B1B33;text-decoration:none;border:1.5px solid #fff}
.store svg{width:24px;height:24px;flex:none}
.store span{display:flex;flex-direction:column;line-height:1.15}.store small{font-size:11.5px;font-weight:600;opacity:.7}.store b{font-family:var(--f-display);font-size:17px}
.store em{font-style:normal;font-size:11px;font-weight:800;padding:3px 7px;border-radius:99px;background:#E7F7F3;color:#0C6B5C}
.store.off{background:transparent;color:#C9D4E5;border-color:#33456A;cursor:default}.store.off em{background:#1E2D47;color:#C9D4E5}
.phone{flex:0 1 280px;max-width:100%;margin-inline:auto;border-radius:38px;padding:10px;background:#1B2A44;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.phone-in{border-radius:30px;background:#0A1528;padding:20px 14px 26px;display:flex;flex-direction:column;gap:10px;min-height:420px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="strip" role="note">
  <div class="wrap">
    <b>TEST ENVIRONMENT</b><span>Simulated exchanges only — no real money moves. Test data is saved in this browser only.</span>
    <div class="seg" role="group" aria-label="Choose what to view">
      <button id="m-web" aria-pressed="true" data-mode="website">Website</button>
      <button id="m-admin" aria-pressed="false" data-mode="admin">Admin dashboard</button>
    </div>
  </div>
</div>

<div id="layer"></div>

<script>
// ---------------------------------------------------------------- reference data
const PROVIDERS = [
  {code:'sahal',name:'Sahal',group:'WaafiPay',country:'SO',cur:'USD',collect:true,payout:true,fields:['API base URL','Merchant UID','API user ID','API key']},
  {code:'evc_plus',name:'EVC Plus',group:'WaafiPay',country:'SO',cur:'USD',collect:true,payout:true,fields:['API base URL','Merchant UID','API user ID','API key']},
  {code:'edahab',name:'eDahab',group:null,country:'SO',cur:'USD',collect:true,payout:true,fields:['API base URL','Merchant / agent code','API key','API secret']},
  {code:'premier_wallet',name:'Premier Wallet',group:null,country:'SO',cur:'USD',collect:true,payout:true,fields:['API base URL','Merchant ID','API key','API secret']},
  {code:'ebirr',name:'eBirr',group:null,country:'ET',cur:'ETB',collect:true,payout:true,fields:['API base URL','Merchant ID / short code','Client ID','Client secret']},
  {code:'mpesa',name:'M-Pesa',group:null,country:'KE',cur:'KES',collect:true,payout:true,fields:['Daraja base URL','Consumer key','Consumer secret','Business short code','STK passkey','B2C initiator']},
  {code:'binance',name:'Binance',group:null,country:'—',cur:'USD',collect:false,payout:false,fields:['API base URL','API key','API secret']},
  {code:'visa',name:'Visa',group:'Card processor',country:'—',cur:'USD',collect:true,payout:false,fields:['Processor name','API base URL','Publishable key','Secret key']},
];
const P = Object.fromEntries(PROVIDERS.map(p=>[p.code,p]));
const SOMALI = ['sahal','evc_plus','edahab','premier_wallet'];
const ROUTES = (()=>{const r=[['sahal','edahab'],['sahal','premier_wallet'],['edahab','sahal'],['premier_wallet','sahal'],['evc_plus','edahab'],['evc_plus','premier_wallet'],['edahab','evc_plus'],['premier_wallet','evc_plus'],['edahab','premier_wallet'],['premier_wallet','edahab'],['ebirr','mpesa'],['mpesa','ebirr']];SOMALI.forEach(w=>r.push([w,'ebirr'],['ebirr',w],[w,'mpesa'],['mpesa',w]));return r})();
// SANDBOX TEST RATES — illustrative, not market rates. Editable in Admin → Exchange management.
const DEFAULT_RATES = {'USD>ETB':[125000000,50],'ETB>USD':[8000,50],'USD>KES':[129000000,50],'KES>USD':[7750,50],'ETB>KES':[1032000,50],'KES>ETB':[969000,50]};
const SYM = {USD:'$',ETB:'Br ',KES:'KSh '};
const STATUS = {created:'Created',quoted:'Quoted',awaiting_payment:'Awaiting payment',payment_verified:'Payment verified',payout_processing:'Sending',settled:'Completed',failed:'Failed',cancelled:'Cancelled',manual_review:'Under review',refunded:'Refunded'};
const PSTATUS = {not_configured:'Not Configured',sandbox:'Sandbox Ready',testing:'Testing',awaiting_approval:'Awaiting Provider Approval',live:'Live',disabled:'Disabled',error:'Error'};

// ---------------------------------------------------------------- fee engine (same integer maths as the app and API)
const feeMinor=(a,bps)=>a<=0||bps<=0?0:Math.floor((a*bps+5000)/10000);
const conv=(m,r)=>m<=0?0:Math.floor((m*r+500000)/1000000);
const applied=(mid,s)=>Math.floor((mid*(10000-s)+5000)/10000);
function rateFor(a,b){ if(a===b) return [1000000,0]; return state.rates[a+'>'+b]||null; }
function quote(from,to,amount){
  const fc=P[from].cur, tc=P[to].cur, r=rateFor(fc,tc); if(!r) return null;
  const route=state.routes[from+'>'+to]||{enabled:false,pfee:0};
  const fee=feeMinor(amount,state.fee), pfee=feeMinor(amount,route.pfee||0), net=Math.max(0,amount-fee-pfee);
  const rate=applied(r[0],r[1]), receive=conv(net,rate), diff=conv(net,r[0])-receive;
  return {from,to,cur:fc,rcur:tc,amount,feeBps:state.fee,fee,pfee,net,mid:r[0],rate,receive,diff};
}
const money=(m,c)=>(m<0?'−':'')+SYM[c]+(Math.abs(m)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const rateTxt=(r)=>(r/1e6).toLocaleString('en-US',{maximumFractionDigits:r<1e6?5:2,minimumFractionDigits:2});
const parseAmt=(s)=>{const m=String(s).replace(/,/g,'').trim().match(/^(\d{1,9})(?:\.(\d{0,2}))?$/);return m?parseInt(m[1])*100+parseInt((m[2]||'').padEnd(2,'0')||'0'):null};
const big=(m)=>{const a=Math.abs(m)/100,sg=m<0?'−':'';return a>=1e6?sg+'$'+(a/1e6).toFixed(2)+'M':a>=1e4?sg+'$'+(a/1e3).toFixed(1)+'K':money(m,'USD');};
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=(p)=>p+Math.random().toString(36).slice(2,10).toUpperCase();
const fmtDate=(t)=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function usd(m,c){ if(c==='USD') return m; const r=rateFor(c,'USD'); return r?conv(m,r[0]):0; }

// ---------------------------------------------------------------- status machine (time-based, so every viewer sees the same progress)
const PLAN={success:[[3000,'payment_verified'],[5500,'payout_processing'],[8500,'settled']],fail_payment:[[4000,'failed']],fail_payout:[[3000,'payment_verified'],[5500,'payout_processing'],[8500,'failed'],[12000,'refunded']],manual_review:[[3000,'payment_verified'],[5500,'manual_review']]};
const REASON={fail_payment:'The sending provider declined the payment (simulated).',fail_payout:'The receiving provider rejected the payout. The money was returned (simulated).',manual_review:'Held for review by the operations team (simulated).'};
function live(tx){
  const now=Date.now(), ev=[{s:'created',at:tx.createdAt},{s:'awaiting_payment',at:tx.createdAt}];
  for(const [ms,s] of PLAN[tx.outcome]||PLAN.success){ if(now-tx.createdAt>=ms) ev.push({s,at:tx.createdAt+ms}); }
  if(tx.resolution) ev.push({s:tx.resolution.status,at:tx.resolution.at});
  const status=ev[ev.length-1].s;
  return {...tx,events:ev,status,reason:(status==='settled'?null:(tx.resolution?.note||REASON[tx.outcome]||null))};
}
const pillFor=(s)=>s==='settled'?'p-ok':(s==='failed'||s==='cancelled')?'p-bad':s==='refunded'?'p-mute':'p-warn';

// ---------------------------------------------------------------- state & storage
const state={
  mode:'website', page:'home', tab:'overview',
  fee:100, feeHistory:[], rates:{...DEFAULT_RATES},
  routes:Object.fromEntries(ROUTES.map(([a,b])=>[a+'>'+b,{enabled:true,pfee:b==='mpesa'?50:0}])),
  providers:Object.fromEntries(PROVIDERS.map(p=>[p.code,{status:['binance','visa'].includes(p.code)?'not_configured':'sandbox',enabled:!['binance','visa'].includes(p.code),creds:{sandbox:[],production:[]},approvals:{api:false,agreement:false,regulatory:false},lastTest:null,logs:[]}])),
  company:{name:'SARIFIO',tagline:'One App. Every Exchange.',website:'sarifio.com',email:'info@sarifio.com',support:'support@sarifio.com',phone:'+252906793240',whatsapp:'+252906793240'},
  tx:[], tickets:[], expenses:[],
  session:null, otp:null, calc:{from:'sahal',to:'edahab',amount:'100.00'}, ex:{from:'sahal',to:'ebirr',amount:'100.00',account:'',name:'',outcome:'success'},
  txFilter:'all', saved:true, custQ:'',
  // Opening float per SARIFIO wallet account (minor units of that wallet's currency) — test values
  float:{evc_plus:2100000,edahab:1800000,sahal:1200000,premier_wallet:900000,ebirr:125000000,mpesa:129000000},
};
try{ state.session=JSON.parse(localStorage.getItem('sarifio_test_session')||'null'); }catch(e){}
let db=null;
async function connect(){
  db = await (window.claude?.use?.('db') ?? null);
  if(!db){ loadLocal(); return; }
  const watch=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));render();},()=>{});
  let swept=false;
  watch('tx',rows=>{state.tx=rows.sort((a,b)=>b.createdAt-a.createdAt);
    // one-off tidy: older demo batches used random ids and duplicate the standard demo set
    if(!swept){swept=true;const legacy=rows.filter(t=>t.demo&&!t.id.startsWith('tx_demo'));
      (async()=>{for(let i=0;i<legacy.length;i+=25) await Promise.all(legacy.slice(i,i+25).map(t=>db.doc('tx/'+t.id).delete().catch(()=>{})));})();}
  });
  const tidy=(col,rows,test)=>{const legacy=rows.filter(r=>!r.id.includes('_demo')&&test(r));(async()=>{for(let i=0;i<legacy.length;i+=25) await Promise.all(legacy.slice(i,i+25).map(r=>db.doc(col+'/'+r.id).delete().catch(()=>{})));})();};
  let sweptT=false,sweptE=false;
  watch('tickets',rows=>{state.tickets=rows.sort((a,b)=>b.createdAt-a.createdAt); if(!sweptT){sweptT=true;tidy('tickets',rows,r=>['Where is my exchange?','M-Pesa limit','Refund question'].includes(r.subject)&&['Amina Yusuf','John Kamau','Hodan Warsame'].includes(r.name));}});
  watch('expenses',rows=>{state.expenses=rows.sort((a,b)=>b.date.localeCompare(a.date)); if(!sweptE){sweptE=true;tidy('expenses',rows,r=>['Staging server — monthly','SMS OTP bundle','Facebook launch ads','Office internet — October'].includes(r.title));}});
  db.collection('config').onSnapshot(s=>{
    for(const d of s.docs){ const v=d.data();
      if(d.id==='fee'){state.fee=v.bps;state.feeHistory=v.history||[];}
      if(d.id==='rates') state.rates={...DEFAULT_RATES,...v.pairs};
      if(d.id==='routes') state.routes={...state.routes,...v.routes};
      if(d.id==='company') state.company={...state.company,...v};
      if(d.id==='float') state.float={...state.float,...v.wallets};
      if(d.id==='providers') for(const k in v.p) state.providers[k]={...state.providers[k],...v.p[k]};
    } render();
  },()=>{});
}

async function del(col,id){ if(db){ try{ await db.doc(col+'/'+id).delete(); }catch(e){} } else { state[col]=state[col].filter(x=>x.id!==id); saveLocal(); render(); } }

    people.length=0; for(let i=0;i<opt.customers;i++) people.push([F[i%F.length]+' '+L[Math.floor(i/F.length)%L.length], '+25290'+String(6000000+i*7919%3999999).padStart(7,'0')]); }
  const routes=ROUTES.filter(([a,b])=>routeOk(a,b)&&(!somaliOnly||(SOMALI.includes(a)&&SOMALI.includes(b))));
  const raw=[];
  for(let d=0; d<days; d++){
    const n=(opt.perDay||0)+3+Math.floor(rnd()*4)+(d<21?2:0);
    for(let k=0;k<n;k++){
      const r=rnd();
      const v= opt.small? 10+Math.pow(r,2.2)*490 : r<.45? 30+rnd()*970 : r<.80? 1000+rnd()*9000 : r<.96? 10000+rnd()*30000 : 40000+rnd()*60000;
      const o=rnd();
      raw.push({route:pick(routes),v,outcome:o<.90?'success':o<.95?'fail_payout':'fail_payment',at:now-d*864e5-Math.floor(rnd()*80e6)-6e5,per:pick(people),acc:1000+Math.floor(rnd()*9000)});

  if(opt.float){ const day=new Date(now); day.setHours(0,0,0,0); const bal={...opt.float};
    const asc=raw.map((x,i)=>i).filter(i=>raw[i].at>=day.getTime()).sort((a,b)=>raw[a].at-raw[b].at);
    for(const i of asc){ const x=raw[i]; if(x.outcome!=='success') continue; const v=Math.round(x.v*k)*100;
      if((bal[x.route[1]]??0)<v){ const alt=Object.keys(bal).filter(w=>w!==x.route[0]&&SOMALI.includes(w)).sort((a,b)=>bal[b]-bal[a])[0];
        if(alt&&bal[alt]>=v) x.route=[x.route[0],alt]; else { x.outcome='manual_review'; continue; } }
      bal[x.route[1]]-=v; bal[x.route[0]]=(bal[x.route[0]]||0)+v; } }

    .map((x,i)=>({id:'exp_demo'+i,data:{title:x[0],category:x[1],amount:x[2],cur:'USD',status:x[3],supplier:x[4],date:new Date(now-i*864e5*4).toISOString().slice(0,10)}}));
  return {tx,tickets,expenses};
}

    if(!filled.length) return toast('Enter at least one field.'); s.creds[env]=[...new Set([...s.creds[env],...filled])]; if(env==='sandbox'&&s.status==='not_configured') s.status='testing';
    s.logs.unshift({at:Date.now(),msg:`${env} credentials updated (${filled.length} fields)`}); await saveProviders(); closeModal(); toast('Credentials saved. Values are not stored on this test page.'); render(); return; }
  if(k==='approvals'){ const code=f.dataset.code, s=state.providers[code]; s.approvals={api:document.getElementById('ap-api').checked,agreement:document.getElementById('ap-agreement').checked,regulatory:document.getElementById('ap-regulatory').checked};
    if(s.approvals.api&&s.approvals.agreement&&!s.approvals.regulatory&&s.status!=='live') s.status='awaiting_approval'; s.logs.unshift({at:Date.now(),msg:'Approvals updated'}); await saveProviders(); closeModal(); render(); return; }
  if(k==='expense'){ const amt=parseAmt(v('x-amt')); if(!amt) return toast('Enter the amount.'); await put('expenses',rid('exp_'),{title:v('x-title'),category:v('x-cat'),amount:amt,cur:v('x-cur'),supplier:v('x-sup')||'',status:'draft',date:new Date().toISOString().slice(0,10)}); f.reset(); toast('Expense saved as draft.'); return; }
  if(k==='company'){ state.company={name:v('co-name'),tagline:v('co-tag'),website:v('co-web'),email:v('co-email'),support:v('co-sup'),phone:v('co-phone'),whatsapp:v('co-wa')}; await putConfig('company',state.company); toast('Company details published.'); render(); return; }
});

// keep progress moving for exchanges in flight
setInterval(()=>{ if(state.tx.some(t=>Date.now()-t.createdAt<15000)) { if(openReceipt){ const sc=document.querySelector('.modal .card')?.scrollTop||0; receipt(openReceipt); const c=document.querySelector('.modal .card'); if(c) c.scrollTop=sc; }
    if(!document.querySelector('.modal')&&!(document.activeElement&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))) render(); } },1500);

if(location.hash==='#admin') state.mode='admin';
render(); connect();
</script>
